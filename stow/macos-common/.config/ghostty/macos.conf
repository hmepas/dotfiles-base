# macOS overlay for ~/.config/ghostty/config (see term-gui).

# Cyrillic in bold (like iTerm2 "Non-ASCII font = Bold") so latin c and cyrillic с
# never look the same. Ghostty matches fonts by family name only, so the bold face
# is cloned into its own family by scripts/make-hack-nfm-bold-family.py (see README).
font-codepoint-map = U+0400-U+04FF=Hack NFM Bold
font-size = 15

keybind = global:cmd+/=toggle_quick_terminal
# Option = plain macOS Option (symbols like — via shift+opt+-), as iTerm2 "Normal".
# opt+arrows still arrive as ESC[1;3C/D and are bound in zsh keybinding.zsh.
macos-option-as-alt = false
background-blur-radius = 20
macos-titlebar-style = hidden

# otherwise it breaks tuios, since ctrl-a is a prefix there
keybind = super+left=esc:OH
keybind = super+right=esc:OF
