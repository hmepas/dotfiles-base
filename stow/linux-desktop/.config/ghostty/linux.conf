# Linux desktop (Hyprland) overlay for ~/.config/ghostty/config (see term-gui).

font-family = "Symbols Nerd Font Mono"
font-size = 13

# Super+/ is free in Hyprland; quick terminal needs the global-shortcuts portal.
keybind = global:super+/=toggle_quick_terminal

right-click-action = paste
keybind = shift+insert=paste_from_clipboard

# Keep one GTK instance alive: new windows open instantly.
initial-window = true
quit-after-last-window-closed = false

app-notifications = no-clipboard-copy

# Ctrl+<cyrillic> -> control bytes (Linux-only Ghostty bug, see the file).
config-file = ctrl-ru.conf
