# ghostty-ctrl-ru.conf
#
# Make Ctrl+<cyrillic> send the same control byte as Ctrl+<latin on the same
# physical key>, so TUI shortcuts work while the Russian (ЙЦУКЕН) layout is active.
# Workaround for the open ghostty Linux bug (see README / ghostty #7309, #3584).
#
# Mechanism: ghostty matches a single-codepoint trigger by the character the
# current layout produces, so `ctrl+с` only fires on ru. The `text:\xNN` action
# sends the raw C0 control byte, understood by both legacy and kitty-protocol apps.
#
# Use: append to ~/.config/ghostty/config, or `config-file = .../ghostty-ctrl-ru.conf`.
#
# NOTE: ghostty treats `#` as a comment ONLY at the start of a line. A `#` after a
# value is sent as text — so every comment here is on its own line, and keybind
# lines must have NO trailing characters after the \xNN value.

# --- common, high-value (safe) ---

# Ctrl+C  interrupt / SIGINT
keybind = ctrl+с=text:\x03
# Ctrl+D  EOF
keybind = ctrl+в=text:\x04
# Ctrl+Z  suspend
keybind = ctrl+я=text:\x1a
# Ctrl+R  reverse history search
keybind = ctrl+к=text:\x12
# Ctrl+W  delete word
keybind = ctrl+ц=text:\x17
# Ctrl+A  start of line
keybind = ctrl+ф=text:\x01
# Ctrl+E  end of line
keybind = ctrl+у=text:\x05
# Ctrl+U  clear line (before cursor)
keybind = ctrl+г=text:\x15
# Ctrl+K  kill to end of line
keybind = ctrl+л=text:\x0b
# Ctrl+L  clear screen
keybind = ctrl+д=text:\x0c
# Ctrl+N  next / down
keybind = ctrl+т=text:\x0e
# Ctrl+P  previous / up
keybind = ctrl+з=text:\x10
# Ctrl+B  back char / tmux prefix
keybind = ctrl+и=text:\x02
# Ctrl+F  forward char / search
keybind = ctrl+а=text:\x06
# Ctrl+G  cancel (readline/emacs)
keybind = ctrl+п=text:\x07
# Ctrl+T  transpose / fzf-file
keybind = ctrl+е=text:\x14
# Ctrl+V  literal-next / paste (app-dependent)
keybind = ctrl+м=text:\x16
# Ctrl+X  emacs prefix / yazi
keybind = ctrl+ч=text:\x18
# Ctrl+Y  yank / paste (readline)
keybind = ctrl+н=text:\x19
# Ctrl+O  operate-and-get-next
keybind = ctrl+щ=text:\x0f

# --- flow control (handy, but Ctrl+S can freeze a TTY) ---

# Ctrl+S  forward search / XOFF
keybind = ctrl+ы=text:\x13
# Ctrl+Q  XON / resume
keybind = ctrl+й=text:\x11

# --- CAREFUL: these equal Tab / Backspace / LF / Enter. Enable only if you
#     really want Ctrl+<that cyrillic> to behave as the control key, not the letter.

# Ctrl+I = TAB
# keybind = ctrl+ш=text:\x09
# Ctrl+H = Backspace
# keybind = ctrl+р=text:\x08
# Ctrl+J = LF (newline)
# keybind = ctrl+о=text:\x0a
# Ctrl+M = CR (Enter)
# keybind = ctrl+ь=text:\x0d
