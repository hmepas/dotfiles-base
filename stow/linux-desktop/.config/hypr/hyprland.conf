# This is an example Hyprland config file.
# Refer to the wiki for more information.
# https://wiki.hypr.land/Configuring/

# Please note not all available settings / options are set here.
# For a full list, see the wiki

# You can split this configuration into multiple files
# Create your files separately and then link them to this file like this:
# source = ~/.config/hypr/myColors.conf


env = WLR_DRM_DEVICES,/dev/dri/card1:/dev/dri/card0
env = EDITOR,nvim

env = NVD_BACKEND,direct
env = MOZ_DISABLE_RDD_SANDBOX,1
env = LIBVA_DRIVER_NAME,nvidia

blurls = waybar

################
### MONITORS ###
################

# See https://wiki.hypr.land/Configuring/Monitors/
#monitor=,preferred,auto,auto
# 10-bit mode (`bitdepth, 10`) caused NVIDIA/Aquamarine GBM XR30 allocation errors and flicker after updates.
# Keep 8-bit unless you explicitly retest 10-bit on a newer driver/Hyprland.
# Main monitor. Its logical size at scale 1.25 is 3072x1728.
# Shift it right and vertically center it relative to the 1080x1920 portrait monitor.
monitor=HDMI-A-1, 3840x2160@160, 1080x96, 1.25
# Match the secondary monitor by EDID description: its DP-* name may change after reboot.
# It is left of the main display and rotated 90 degrees clockwise.
monitor=desc:Dell Inc. DELL U2414H 9TG463BF2MUL, 1920x1080@60, 0x0, 1, transform, 1
#monitor=HDMI-A-1, 3840x2160@160, 0x0, 1


###################
### MY PROGRAMS ###
###################

# See https://wiki.hypr.land/Configuring/Keywords/

# Set programs that you use
$terminal = ghostty
$fileManager = yazi
$menu = wofi --show=drun -iGDd -M=fuzzywofi --show=drun -iGDd -M=fuzzy


#################
### AUTOSTART ###
#################

# Autostart necessary processes (like notifications daemons, status bars, etc.)
# Or execute your favorite apps at launch like this:

# exec-once = $terminal
# exec-once = nm-applet &
# exec-once = waybar & hyprpaper & firefox
exec-once = waybar & hyprpaper # hyprpaper for wallpapers
# Resolve the secondary monitor's unstable DP-* name and apply its black wallpaper.
exec-once = ~/.config/hypr/scripts/configure_secondary.sh
# Load Hyprland plugins, then reparse config so plugin dispatchers (hyprexpo:*) bind cleanly after updates/restarts.
# After a system/Hyprland update, Hyprland ABI changes often make plugins stale. If plugin dispatchers
# become invalid again, run this manually from a terminal inside Hyprland:
#   hyprpm update
#   hyprpm enable hyprexpo   # only needed if hyprpm shows hyprexpo disabled/renamed after update
#   hyprpm reload -n
#   hyprctl reload
# Check state with:
#   hyprpm list
#   hyprctl configerrors
exec-once = hyprpm reload -n && hyprctl reload
exec-once = nm-applet --indicator        # Network icon in tray
exec-once = wl-paste --type text --watch cliphist store # Clipboard
exec-once = wl-paste --type image --watch cliphist store
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1 # password-manager

# Alfred replacement 
exec-once = albert &                     # Afred ftw
# elephant service enable
# or next string:
#exec-once = elephant &
exec-once = walker --gapplication-service

# so it's always running
exec-once = [workspace special:quickterm silent] ghostty  --gtk-single-instance=false --class=com.mitchellh.ghostty.quickterm
windowrule = match:class ^(com.mitchellh.ghostty.quickterm)$, workspace special:quickterm

# and another one for myself
exec-once = ghostty

#exec-once = hyprswitch init --show-title &
exec-once = snappy-switcher --daemon

#notifications 
exec-once = swaync




#############################
### ENVIRONMENT VARIABLES ###
#############################

# See https://wiki.hypr.land/Configuring/Environment-variables/

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = LIBVA_DRIVER_NAME,nvidia
env = XDG_SESSION_TYPE,wayland
env = GBM_BACKEND,nvidia-drm
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = WLR_NO_HARDWARE_CURSORS,1


###################
### PERMISSIONS ###
###################

# See https://wiki.hypr.land/Configuring/Permissions/
# Please note permission changes here require a Hyprland restart and are not applied on-the-fly
# for security reasons

# ecosystem {
#   enforce_permissions = 1
# }

# permission = /usr/(bin|local/bin)/grim, screencopy, allow
# permission = /usr/(lib|libexec|lib64)/xdg-desktop-portal-hyprland, screencopy, allow
