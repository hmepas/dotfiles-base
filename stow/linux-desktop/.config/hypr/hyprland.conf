#####################
### LOOK AND FEEL ###
#####################

# Refer to https://wiki.hypr.land/Configuring/Variables/

# https://wiki.hypr.land/Configuring/Variables/#general
general {
    gaps_in = 5
    gaps_out = 20

    border_size = 2

    # https://wiki.hypr.land/Configuring/Variables/#variable-types for info about colors
    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)

    # Set to true enable resizing windows by clicking and dragging on borders and gaps
    resize_on_border = true

    # Please see https://wiki.hypr.land/Configuring/Tearing/ before you turn this on
    allow_tearing = true

    layout = dwindle
}

# https://wiki.hypr.land/Configuring/Variables/#decoration
decoration {
    rounding = 10
    rounding_power = 2

    # Change transparency of focused and unfocused windows
    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    # https://wiki.hypr.land/Configuring/Variables/#blur
    blur {
        enabled = true
        size = 3
        passes = 1

        vibrancy = 0.1696
    }
}

# https://wiki.hypr.land/Configuring/Variables/#animations
animations {
    enabled = yes, please :)

    # Default curves, see https://wiki.hypr.land/Configuring/Animations/#curves
    #        NAME,           X0,   Y0,   X1,   Y1
    bezier = easeOutQuint,   0.23, 1,    0.32, 1
    bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1
    bezier = linear,         0,    0,    1,    1
    bezier = almostLinear,   0.5,  0.5,  0.75, 1
    bezier = quick,          0.15, 0,    0.1,  1

    # Default animations, see https://wiki.hypr.land/Configuring/Animations/
    #           NAME,          ONOFF, SPEED, CURVE,        [STYLE]
    animation = global,        1,     10,    default
    animation = border,        1,     5.39,  easeOutQuint
    animation = windows,       1,     4.79,  easeOutQuint
    animation = windowsIn,     1,     4.1,   easeOutQuint, popin 87%
    animation = windowsOut,    1,     1.49,  linear,       popin 87%
    animation = fadeIn,        1,     1.73,  almostLinear
    animation = fadeOut,       1,     1.46,  almostLinear
    animation = fade,          1,     3.03,  quick
    animation = layers,        1,     3.81,  easeOutQuint
    animation = layersIn,      1,     4,     easeOutQuint, fade
    animation = layersOut,     1,     1.5,   linear,       fade
    animation = fadeLayersIn,  1,     1.79,  almostLinear
    animation = fadeLayersOut, 1,     1.39,  almostLinear
    animation = workspaces,    1,     1.94,  almostLinear, fade
    animation = workspacesIn,  1,     1.21,  almostLinear, fade
    animation = workspacesOut, 1,     1.94,  almostLinear, fade
    animation = zoomFactor,    1,     7,     quick
}

# Ref https://wiki.hypr.land/Configuring/Workspace-Rules/
# Keep one dedicated workspace on the secondary monitor and all numbered
# workspaces on the main monitor.
workspace = name:left, monitor:desc:Dell Inc. DELL U2414H 9TG463BF2MUL, default:true, persistent:true
workspace = 1, monitor:HDMI-A-1
workspace = 2, monitor:HDMI-A-1
workspace = 3, monitor:HDMI-A-1
workspace = 4, monitor:HDMI-A-1
workspace = 5, monitor:HDMI-A-1
workspace = 6, monitor:HDMI-A-1
workspace = 7, monitor:HDMI-A-1
workspace = 8, monitor:HDMI-A-1
workspace = 9, monitor:HDMI-A-1
workspace = 10, monitor:HDMI-A-1

# "Smart gaps" / "No gaps when only"
# uncomment all if you wish to use that.
workspace = w[tv1], gapsout:3, gapsin:0
workspace = f[1], gapsout:0, gapsin:0
windowrule {
    name = no-gaps-wtv1
    match:float = false
    match:workspace = w[tv1]

    border_size = 2
    rounding = 10
}

windowrule {
    name = no-gaps-f1
    match:float = false
    match:workspace = f[1]

    border_size = 0
    rounding = 0
}

# forsmall floating windows
windowrule {
    name = calc-rules
    match:class = ^(gnome-calculator|qalculate-gtk|kcalc)$
    float = on
    pseudo = on
    center = on
    size = 400 500
}

# Screenshot window shouldn't disturb layout
windowrule {
    name = satty-float
    match:class = ^com.gabm.satty$
    float = true
}

# Yazi under ghostty
windowrule {
    name = yazi-float
    match:class = ^com.mitchellh.ghostty.yazifloat$
    float = on
    center = on
    size = 800 500
}

# See https://wiki.hypr.land/Configuring/Dwindle-Layout/ for more
dwindle {
    preserve_split = true # You probably want this
}

# See https://wiki.hypr.land/Configuring/Master-Layout/ for more
master {
    new_status = master
}

# https://wiki.hypr.land/Configuring/Variables/#misc
misc {
    force_default_wallpaper = -1 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = false # If true disables the random hyprland logo / anime girl background. :(
    vrr = 1
}

xwayland {
    force_zero_scaling = true
}

# Rendering for games
render {
    # Новое динамическое планирование кадров
    new_render_scheduling = on
}

windowrule {
    name = albion_performance
    match:class = ^(Albion-Online)$
    immediate = on
    fullscreen = on
    workspace = 7
}

windowrule {
    name = steam_apps
    match:class = ^(steam_app_.*)$
    immediate = on
    fullscreen = on
    workspace = 7
}

# Pin apps to their dedicated workspaces (silent: don't steal focus on launch)
windowrule {
    name = pin-obsidian
    match:class = ^(obsidian)$
    workspace = 8
}

windowrule {
    name = pin-bitwarden
    match:class = ^(Bitwarden)$
    workspace = 8
}


windowrule {
    name = pin-telegram
    match:class = ^(org\.telegram\.desktop)$
    workspace = 10
    # Ignore Telegram activation requests (e.g. on incoming messages).
    focus_on_activate = false
}


#############
### INPUT ###
#############

# https://wiki.hypr.land/Configuring/Variables/#input
input {
    kb_layout = us,ru
    kb_variant =
    kb_model =
    #kb_options = grp:alt_shift_toggle
    # caps:hyper — Caps Lock now acts as Hyper_L (Mod3 in Hyprland). See $hyper below.
    kb_options = grp:alt_space_toggle,caps:hyper
    kb_rules =

    follow_mouse = 1

    touchpad {
        natural_scroll = false
    }

    repeat_rate = 50
    repeat_delay = 200

    # mouse settings, everything is in mouse memory
    sensitivity = 0 

    # no accel at all
    accel_profile = flat
    
    # Дополнительная страховка для игнорирования настроек ускорения из libinput
    force_no_accel = true

}

# See https://wiki.hypr.land/Configuring/Gestures
gesture = 3, horizontal, workspace

# Example per-device config
# See https://wiki.hypr.land/Configuring/Keywords/#per-device-input-configs for more
device {
    name = epic-mouse-v1
    sensitivity = -0.5
}


###################
### KEYBINDINGS ###
###################

# See https://wiki.hypr.land/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier
$moveMod = $mainMod SHIFT
$swapMod = $mainMod ALT
$hyper = MOD3 # Caps Lock remapped via kb_options = caps:hyper

# Example binds, see https://wiki.hypr.land/Configuring/Binds/ for more
#bind = $mainMod, Q, exec, $terminal
bind = $mainMod, Q, killactive,
#bind = $mainMod, C, killactive,
bind = $mainMod, M, exec, command -v hyprshutdown >/dev/null 2>&1 && hyprshutdown || hyprctl dispatch exit
bind = $mainMod, E, exec, ghostty --gtk-single-instance=false --class="com.mitchellh.ghostty.yazifloat" -e $fileManager
bind = $mainMod, R, exec, $menu
bind = $moveMod, P, pseudo, # dwindle
bind = $mainMod, comma, layoutmsg, togglesplit # dwindle
bind = $mainMod, F, togglefloating,
bind = $mainMod SHIFT, F, fullscreen, 0

# Move focus with mainMod + arrow keys
# use hjkl, arrows for home/end
# bind = $mainMod, left, movefocus, l
# bind = $mainMod, right, movefocus, r
# bind = $mainMod, up, movefocus, u
# bind = $mainMod, down, movefocus, d
bind = $mainMod, left,  sendshortcut, , home, activewindow
bind = $mainMod, right, sendshortcut, , end, activewindow
bind = $mainMod, up,    sendshortcut, CTRL, home, activewindow
bind = $mainMod, down,  sendshortcut, CTRL, end, activewindow

bind = $mainMod, h, movefocus, l # Left
bind = $mainMod, l, movefocus, r # Right
bind = $mainMod, k, movefocus, u # Up
bind = $mainMod, j, movefocus, d # Down

# Перенос окна в соседние узлы (movewindow)
bind = $moveMod, h, movewindow, l
bind = $moveMod, j, movewindow, d
bind = $moveMod, k, movewindow, u
bind = $moveMod, l, movewindow, r

# Перенос текущего окна между мониторами
bind = $moveMod, A, movewindow, mon:desc:Dell Inc. DELL U2414H 9TG463BF2MUL
bind = $moveMod, D, movewindow, mon:HDMI-A-1

# Смена позиций окон (swapwindow)
bind = $swapMod, h, swapwindow, l
bind = $swapMod, j, swapwindow, d
bind = $swapMod, k, swapwindow, u
bind = $swapMod, l, swapwindow, r

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

bind = $mainMod, SPACE, centerwindow

# Example special workspace (scratchpad)
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

#bind = CTRL, SPACE, exec, albert toggle
#bind = SUPER ALT, SPACE, exec, walker
#bind = SUPER ALT, SPACE, exec, nc -U /run/user/1000/walker/walker.sock
bind = CTRL, SPACE, exec, nc -U /run/user/1000/walker/walker.sock

# hyprswitch
# --mod alt is required since snappy-switcher 4.0.0: without it the switcher opens in
# "toggle mode" (overlay grabs the keyboard, no dismiss-on-release), so only the first
# Tab works. The --mod value must match the modifier in this bind.
bind = ALT, TAB, exec, snappy-switcher next --mod alt
# Some alternatives
#bind = ALT, TAB, exec, hypr-alttab
#bindr = ALT, TAB, exec, hyprswitch gui --mod-key alt --key tab --close mod-key-release --sort-recent
#bind = ALT, TAB, exec, hyprswitch simple -o 1 --sort-recent
#bind = ALT, grave, exec, hyprswitch gui --mod-key alt --key grave --close mod-key-release --filter-same-class --sort-recent
#bind = SUPER, grave, exec, hyprswitch gui --mod-key alt --key grave --close mod-key-release --filter-current-workspace --sort-recent

bind = $hyper, B, exec, google-chrome-stable

bind = $hyper, T, exec, ghostty
bind = $mainMod, T, exec, ghostty
bind = $mainMod+SHIFT, T, togglespecialworkspace, quickterm

# Hyper (Caps Lock) app launchers — focus if running, launch otherwise.
# Workspace is pinned via windowrule above; focuswindow follows the window to its workspace.
# Note: class regex must be single-quoted — bind exec is run via /bin/sh, parens would otherwise open a subshell.
bind = $hyper, W, exec, hyprctl clients | grep -q "class: Bitwarden" && hyprctl dispatch focuswindow "class:Bitwarden" || flatpak run com.bitwarden.desktop
bind = $hyper, O, exec, hyprctl clients | grep -q "class: obsidian" && hyprctl dispatch focuswindow "class:obsidian" || obsidian
bind = $hyper, G, exec, hyprctl clients | grep -q "class: org.telegram.desktop" && hyprctl dispatch focuswindow "class:org.telegram.desktop" || Telegram

# not working, while hyprctl globalshortcuts shows toggle_quick_terminal
#bind = $mainMod, slash, global, toggle_quick_terminal
bind = $mainMod, slash, pass, class:^(com\.mitchellh\.ghostty\.quickterm)$


# Clipboard history
#bind = $mainMod + ALT, c, exec, cliphist list | wofi -G -S dmenu -M fuzzy | cliphist decode | tee >(wl-copy) | wl-copy -p && wtype -M shift -k Insert -m shift
bind = $mainMod + ALT, c, exec, cliphist list | rofi -dmenu --matching fuzzy | cliphist decode | tee >(wl-copy) | wl-copy -p && wtype -M shift -k Insert -m shift


# Screenshot
# Area
bind = , Print, exec, hyprshot -m region -- ~/bin/screenshot-edit
# Current window
bind = $mainMod, Print, exec, hyprshot -m window -- ~/bin/screenshot-edit
# Screen
bind = SHIFT, Print, exec, hyprshot -m output -- ~/bin/screenshot-edit


# OBS
bind = $mainMod, F1, exec, ~/.config/hypr/obs_toggle.sh

# Nofitication server thru swaync
bind = $hyper, right, exec, swaync-client -t

##############################
### WINDOWS AND WORKSPACES ###
##############################

# See https://wiki.hypr.land/Configuring/Window-Rules/ for more
# See https://wiki.hypr.land/Configuring/Workspace-Rules/ for workspace rules

# Example windowrules that are useful

windowrule {
    # Ignore maximize requests from all apps. You'll probably like this.
    name = suppress-maximize-events
    match:class = .*

    suppress_event = maximize
}


windowrule {
    # Fix some dragging issues with XWayland
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false

    no_focus = true
}

# Hyprland-run windowrule
windowrule {
    name = move-hyprland-run

    match:class = hyprland-run

    move = 20 monitor_h-120
    float = yes
}

##############################
###     PLUGINS            ###
##############################

plugin {
    hyprexpo {
        columns = 3
        gap_size = 5
        bg_col = rgb(111111)
        workspace_method = center current # или 'first 1'
    }
}

# Bind Super + Tab (Mac OS X Mission Control alternative)
# do this after system update
# hyprpm update
bind = $mainMod, tab, hyprexpo:expo, toggle

# subman for hyprexpo keyboard navigation
submap = hyprexpo

bind = , h, hyprexpo:kb_focus, left
bind = , l, hyprexpo:kb_focus, right
bind = , k, hyprexpo:kb_focus, up
bind = , j, hyprexpo:kb_focus, down

bind = , return, hyprexpo:kb_confirm

# Закрытие сетки без выбора
bind = , escape, hyprexpo:expo, off

# Обязательный возврат в дефолтный режим обработки клавиш
submap = reset

### GROUPS
group {
    col.border_active = rgba(33ccffee) rgba(00ff99ee) 45deg
    
    groupbar {
        enabled = true
        font_size = 10
        gradients = true
        render_titles = true
        col.active = rgba(33ccffee)
        col.inactive = rgba(595959aa)
    }
}
# Превратить окно в группу (или добавить в существующую)
bind = SUPER, G, exec, ~/.config/hypr/scripts/toggle_to_stack.sh

# Навигация внутри "аккордеона" (по табам)
bind = SUPER, n, changegroupactive, f
bind = SUPER, p, changegroupactive, b



